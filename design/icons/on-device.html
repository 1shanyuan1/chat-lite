<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>成品预览 · 真机渲染规则</title>
<style>
  body { font-family: system-ui, "Segoe UI", "Microsoft YaHei", sans-serif; background: #f4f4f3; color: #2b2b2b; margin: 0; padding: 30px; display: flex; flex-direction: column; gap: 26px; align-items: center; }
  .card { background: #fff; border-radius: 14px; padding: 24px 30px; box-shadow: 0 2px 10px rgba(0,0,0,.07); width: 900px; }
  h2 { font-size: 15px; margin: 0 0 16px; }
  .note { font-size: 12px; color: #8a8580; margin: 12px 0 0; }
  /* 自适应图标：图层按 Android 规则放大 1.5 倍后再被遮罩裁切 */
  .adaptive { position: relative; width: var(--s); height: var(--s); overflow: hidden; }
  .adaptive .layer { position: absolute; left: -25%; top: -25%; width: 150%; height: 150%; }
  .adaptive img { position: absolute; inset: 0; width: 100%; height: 100%; }
  .circle { border-radius: 50%; }
  .squircle { border-radius: 23%; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .item span { font-size: 12px; color: #55504b; }
  .row { display: flex; gap: 34px; justify-content: center; align-items: flex-start; }
  /* 桌面模拟 */
  .phone { width: 360px; height: 300px; border-radius: 18px; overflow: hidden; background: linear-gradient(160deg, #2b3a67 0%, #4b6cb7 55%, #182848 100%); display: grid; place-items: center; padding: 20px; }
  .app { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .app span { color: #fff; font-size: 13px; text-shadow: 0 1px 3px rgba(0,0,0,.45); }
</style>
</head>
<body>
  <div class="card">
    <h2>桌面效果模拟（Pixel 风圆形遮罩）</h2>
    <div class="phone">
      <div class="app">
        <div class="adaptive circle" style="--s: 96px">
          <div class="layer">
            <img src="./ic_launcher_background.png" alt="">
            <img src="./ic_launcher_foreground.png" alt="">
          </div>
        </div>
        <span>Chat Lite</span>
      </div>
    </div>
    <p class="note">用项目里真实的 mipmap 图层 PNG，按 Android 自适应图标规则（图层放大 1.5 倍、中心 2/3 可见）合成</p>
  </div>

  <div class="card">
    <h2>不同启动器的遮罩形状（192px）</h2>
    <div class="row">
      <div class="item">
        <div class="adaptive circle" style="--s: 192px"><div class="layer"><img src="./ic_launcher_background.png" alt=""><img src="./ic_launcher_foreground.png" alt=""></div></div>
        <span>圆形（Pixel）</span>
      </div>
      <div class="item">
        <div class="adaptive squircle" style="--s: 192px"><div class="layer"><img src="./ic_launcher_background.png" alt=""><img src="./ic_launcher_foreground.png" alt=""></div></div>
        <span>圆角方（多数国产 ROM）</span>
      </div>
      <div class="item">
        <img src="./ic_launcher_round.png" width="192" style="border-radius:50%" alt="圆形">
        <span>传统圆形 ic_launcher_round</span>
      </div>
      <div class="item">
        <img src="./ic_launcher.png" width="192" style="border-radius:16px" alt="方形">
        <span>传统方形 ic_launcher</span>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>小尺寸（缩小后依然能认出）</h2>
    <div class="row" style="align-items:center">
      <div class="adaptive circle" style="--s: 96px"><div class="layer"><img src="./ic_launcher_background.png" alt=""><img src="./ic_launcher_foreground.png" alt=""></div></div>
      <div class="adaptive circle" style="--s: 64px"><div class="layer"><img src="./ic_launcher_background.png" alt=""><img src="./ic_launcher_foreground.png" alt=""></div></div>
      <div class="adaptive circle" style="--s: 48px"><div class="layer"><img src="./ic_launcher_background.png" alt=""><img src="./ic_launcher_foreground.png" alt=""></div></div>
      <img src="./favicon-32.png" width="32" style="border-radius:8px" alt="">
      <span style="max-width:200px">从左到右：96 / 64 / 48 桌面图标，最右 32px 浏览器 favicon</span>
    </div>
  </div>
</body>
</html>
