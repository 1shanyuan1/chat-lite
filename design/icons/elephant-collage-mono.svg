<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- 几何拼贴 · 单色：蒲扇(实心) 墙(实心) 石头(描边,半掩墙后) 柱子(实心) -->
  <g>
    <!-- 头：石头（描边，半掩在墙后） -->
    <rect x="630" y="220" width="230" height="250" rx="40" fill="none" stroke="#111111" stroke-width="28"/>
    <!-- 耳朵：蒲扇（实心，压在墙角后） -->
    <path d="M 330 370 L 330 220 A 150 150 0 0 0 180 370 Z" fill="#111111"/>
    <!-- 身体：墙（实心） -->
    <rect x="210" y="340" width="460" height="320" rx="36" fill="#111111"/>
    <!-- 腿：柱子（高低错落） -->
    <rect x="260" y="690" width="44" height="120" rx="22" fill="#111111"/>
    <rect x="360" y="690" width="44" height="104" rx="22" fill="#111111"/>
    <rect x="500" y="690" width="44" height="104" rx="22" fill="#111111"/>
    <rect x="600" y="690" width="44" height="120" rx="22" fill="#111111"/>
  </g>
</svg>
