<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- 盲人摸象 · 实心剪影：墙+蒲扇+石头融合为一条轮廓，蛇(鼻)无缝出头，绳子(尾)/柱子(腿)/长矛(牙)各就各位 -->
  <g fill="#111111">
    <!-- 腿：柱子（顶端藏进墙里，无接缝） -->
    <rect x="255" y="650" width="54" height="150" rx="27"/>
    <rect x="380" y="650" width="54" height="150" rx="27"/>
    <rect x="530" y="650" width="54" height="150" rx="27"/>
    <rect x="620" y="650" width="54" height="150" rx="27"/>
    <!-- 墙 + 蒲扇（耳） + 石头（头）：一条轮廓线整体走出三个部件 -->
    <path d="M 210 666
             L 210 366
             Q 210 326, 250 326
             L 400 326
             C 460 320, 498 294, 530 260
             C 560 228, 590 208, 622 206
             C 652 204, 674 216, 684 232
             C 696 222, 724 214, 758 214
             C 814 214, 858 240, 858 294
             L 858 442
             Q 858 456, 844 456
             L 700 456
             L 700 626
             Q 700 666, 660 666
             L 250 666
             Q 210 666, 210 626
             Z"/>
    <!-- 鼻子：蛇（从头部右下无缝长出，垂落后回卷，尖端朝上） -->
    <path d="M 858 420
             C 858 500, 824 584, 754 652
             C 694 712, 612 748, 546 748
             C 504 748, 484 720, 494 690
             C 502 664, 530 656, 556 668
             C 606 700, 664 696, 706 646
             C 748 596, 768 540, 768 478
             L 768 420
             Z"/>
    <!-- 牙：长矛（从头前端探出） -->
    <path d="M 812 458 C 842 492, 870 528, 886 558 C 856 556, 826 526, 804 486 Z"/>
    <!-- 尾巴：绳子（尾梢带一个绳结） -->
    <path d="M 214 400 C 148 452, 134 540, 166 600" fill="none" stroke="#111111" stroke-width="14" stroke-linecap="round"/>
    <circle cx="166" cy="600" r="15"/>
  </g>
</svg>
