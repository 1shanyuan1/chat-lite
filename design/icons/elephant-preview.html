<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>大象图标 · 草案</title>
<style>
  body { font-family: system-ui, "Segoe UI", "Microsoft YaHei", sans-serif; background: #f4f4f3; color: #2b2b2b; margin: 0; padding: 30px; display: flex; gap: 26px; justify-content: center; flex-wrap: wrap; }
  .card { background: #fff; border-radius: 14px; padding: 22px 26px; box-shadow: 0 2px 10px rgba(0,0,0,.07); text-align: center; }
  .card h2 { font-size: 15px; margin: 0 0 14px; }
  .note { font-size: 12px; color: #8a8580; margin: 12px 0 0; }
</style>
</head>
<body>
  <div class="card">
    <h2>F · 几何拼贴（优化版）</h2>
    <div class="row">
      <img src="./elephant-collage-mono.svg" width="180" alt="单色">
      <img src="./elephant-collage-color.svg" width="180" alt="彩色">
    </div>
    <p class="note">实心/描边混搭 + 层叠错位；彩色版每件物件一色</p>
  </div>
  <div class="card">
    <h2>D · 盲人摸象（线稿拼装）</h2>
    <img src="./elephant-parable.svg" width="250" alt="D">
    <p class="note">每件物件独立可认 · 没有眼睛——没人摸到眼睛</p>
  </div>
  <div class="card">
    <h2>D2 · 盲人摸象（实心剪影）</h2>
    <img src="./elephant-parable-solid.svg" width="250" alt="D2">
    <p class="note">同一构图的整体剪影版</p>
  </div>
  <div class="card">
    <h2>A · 巨耳派</h2>
    <img src="./elephant-a-giant-ears.svg" width="250" alt="A">
    <p class="note">耳朵占半壁江山，眼睛芝麻大，身体一小坨</p>
  </div>
  <div class="card">
    <h2>B · 巨鼻派</h2>
    <img src="./elephant-b-giant-trunk.svg" width="250" alt="B">
    <p class="note">鼻子比腿长好几倍，拖过画面再卷起</p>
  </div>
  <div class="card">
    <h2>C · 巨身派</h2>
    <img src="./elephant-c-giant-body.svg" width="250" alt="C">
    <p class="note">身体是一块巨石，头/耳/鼻缩成点缀</p>
  </div>
</body>
</html>
