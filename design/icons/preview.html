<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>图标预览 · chat-lite</title>
<style>
  body { font-family: system-ui, "Segoe UI", "Microsoft YaHei", sans-serif; background: #f4f4f3; color: #2b2b2b; margin: 0; padding: 30px; display: flex; gap: 28px; justify-content: center; flex-wrap: wrap; }
  .card { background: #fff; border-radius: 14px; padding: 22px 26px; box-shadow: 0 2px 10px rgba(0,0,0,.07); text-align: center; }
  .card h2 { font-size: 15px; margin: 0 0 16px; }
  .row { display: flex; align-items: flex-end; gap: 20px; justify-content: center; }
  .note { font-size: 12px; color: #8a8580; margin: 14px 0 0; }
</style>
</head>
<body>
  <div class="card">
    <h2>最终版 · 错位 + 顶底出血（r56 / y57% / d170）</h2>
    <div class="row"><img src="./icon-b.svg" width="300" alt="最终版大图"><img src="./icon-b.svg" width="64" alt="中图"><img src="./icon-b.svg" width="32" alt="小图"></div>
    <p class="note">上条从顶边直角伸出、下条从底边伸出不封框；圆点为你微调的参数</p>
  </div>
  <div class="card">
    <h2>实验版 · 满铺马赛克（小方块按顺序排满底图）</h2>
    <div class="row">
      <figure style="margin:0;text-align:center"><img src="./icon-dev-mosaic.svg" width="210" alt="鲜艳马赛克"><figcaption class="note">D · 原色块</figcaption></figure>
      <figure style="margin:0;text-align:center"><img src="./icon-dev-mosaic-pastel.svg" width="210" alt="浅色马赛克"><figcaption class="note">E · 浅色块</figcaption></figure>
    </div>
    <p class="note">8×8 小方块，四渠道色按对角线顺序循环铺满，标志压在上面</p>
  </div>
  <div class="card">
    <h2>实验版 · 色块拼贴（开源 + 邀请试用 + 不稳定）</h2>
    <div class="row">
      <figure style="margin:0;text-align:center"><img src="./icon-dev-grid.svg" width="170" alt="四宫格"><figcaption class="note">A · 四宫格重复</figcaption></figure>
      <figure style="margin:0;text-align:center"><img src="./icon-dev-testcard.svg" width="170" alt="测试卡底"><figcaption class="note">B · 测试卡底+黑标</figcaption></figure>
      <figure style="margin:0;text-align:center"><img src="./icon-dev-blocks.svg" width="170" alt="拼色"><figcaption class="note">C · 拼色标志</figcaption></figure>
    </div>
    <p class="note">四色 = beta蓝 / dev紫 / nightly琥珀 / 开源绿</p>
  </div>
</body>
</html>
